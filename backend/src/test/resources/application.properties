spring.datasource.url=jdbc:h2:mem:appservicos-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-test.sql

app.jwt.secret=chave-exclusiva-de-testes-nao-utilizar-em-producao
app.jwt.expiration-seconds=3600
app.jwt.issuer=appservicos-test
app.cors.allowed-origins=http://localhost:8081

management.endpoints.web.exposure.include=health
